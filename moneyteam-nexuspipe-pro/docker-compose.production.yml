services:
  app:
    build: .
    env_file: .env.production
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/app/storage
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  app_storage:
  app_data:

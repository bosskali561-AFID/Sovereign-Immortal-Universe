<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MONEYTEAM / NexusPipe Pro — Control Plane</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
    header { padding: 16px 24px; border-bottom: 1px solid #262a33; display: flex; gap: 12px; align-items: center; }
    h1 { margin: 0; font-size: 18px; }
    main { padding: 24px; display: grid; gap: 16px; }
    .card { background: #161a21; border: 1px solid #262a33; border-radius: 8px; padding: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .status { font-family: ui-monospace, monospace; white-space: pre-wrap; font-size: 13px; }
    button { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
    button:hover { background: #3b7ae1; }
    input { background: #0f1115; color: #e6e6e6; border: 1px solid #3a4150; border-radius: 6px; padding: 8px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #31261a; color: #ffb86b; }
  </style>
</head>
<body>
  <header>
    <h1>MONEYTEAM / NexusPipe Pro <span class="pill">paper mode</span></h1>
  </header>
  <main>
    <div class="card row">
      <label for="tk">Admin token:</label>
      <input id="tk" type="password" placeholder="x-admin-token" size="24">
    </div>
    <div class="card row">
      <button data-get="/api/v1/health">Health</button>
      <button data-get="/api/v1/readiness">Readiness</button>
      <button data-get="/api/v1/knowledge/summary">Knowledge summary</button>
      <button data-admin-get="/api/v1/config">Config (redacted)</button>
      <button data-admin-get="/api/v1/knowledge/leaderboard">Winners</button>
      <button data-post="/api/v1/lspa/cycle">Run L.S.P.A. cycle</button>
      <button data-explain>Explain anomalies</button>
    </div>
    <div class="card"><div id="out" class="status">No data yet.</div></div>
  </main>
  <script>
    const out = document.getElementById('out');
    const token = () => ({ 'x-admin-token': document.getElementById('tk').value || '' });
    const show = d => out.textContent = JSON.stringify(d, null, 2);
    const get = (url, auth) => fetch(url, auth ? { headers: token() } : {}).then(r => r.json()).then(show);
    document.querySelectorAll('button[data-get]').forEach(b =>
      b.onclick = () => get(b.dataset.get, false));
    document.querySelectorAll('button[data-admin-get]').forEach(b =>
      b.onclick = () => get(b.dataset.get, true));
    document.querySelector('button[data-post]').onclick = () =>
      fetch('/api/v1/lspa/cycle', { method: 'POST', headers: { 'Content-Type': 'application/json', ...token() },
        body: JSON.stringify({ seed: 42, top_n: 2 }) }).then(r => r.json()).then(show);
    document.querySelector('button[data-explain]').onclick = () =>
      fetch('/api/v1/ml/explain', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ values: [10, 10.5, 11, 10.2, 99.5] }) }).then(r => r.json()).then(show);
  </script>
</body>
</html>
